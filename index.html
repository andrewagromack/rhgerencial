<style>/* RH Gerencial — Sistema visual
   Navy + Dorado. Profesional, confiable, tecnológico.
*/

:root {
  --navy-900: #050d24;
  --navy-800: #0a1838;
  --navy-700: #12224a;
  --navy-600: #1c2f60;
  --gold-500: #c9a961;
  --gold-400: #d4b574;
  --gold-300: #e8d4a0;
  --gold-100: #f5ecd3;
  --bone: #f6f2e9;
  --bone-2: #ede6d6;
  --ink: #0d1226;
  --muted: #6b7388;

  --font-sans: 'Manrope', system-ui, -apple-system, sans-serif;
  --font-display: 'Instrument Serif', 'Newsreader', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--bone);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { overflow-x: hidden; }

a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

img, svg { display: block; max-width: 100%; }

/* ===== Layout ===== */

.page { width: 100%; }

.container {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
}
@media (max-width: 720px) {
  .container { padding: 0 20px; }
}
@media (max-width: 420px) {
  .container { padding: 0 16px; }
}

/* ===== Navigation ===== */

.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  background: rgba(5, 13, 36, 0.55);
  border-bottom: 1px solid rgba(201, 169, 97, 0.12);
  gap: 16px;
}

.nav-collapse {
  display: flex;
  align-items: center;
  gap: 28px;
}

.nav-burger {
  display: none;
  background: transparent;
  border: 1px solid rgba(201, 169, 97, 0.35);
  width: 42px; height: 42px;
  border-radius: 8px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  z-index: 102;
  transition: border-color 0.2s, background 0.2s;
}
.nav-burger:hover { border-color: var(--gold-400); background: rgba(201, 169, 97, 0.08); }
.nav-burger span {
  display: block;
  width: 20px;
  height: 2px;
  background: var(--gold-300);
  border-radius: 1px;
  transition: transform 0.25s ease, opacity 0.2s;
}
.nav.is-open .nav-burger span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav.is-open .nav-burger span:nth-child(2) { opacity: 0; }
.nav.is-open .nav-burger span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--bone);
}

.nav-brand .logo-mark { width: 36px; height: 36px; }
.nav-brand .wordmark {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.3;
}
.nav-brand .wordmark b {
  font-style: normal;
  font-family: var(--font-sans);
  font-weight: 700;
  letter-spacing: 0.12em;
  font-size: 14px;
  text-transform: uppercase;
  display: block;
  line-height: 1;
  color: var(--bone);
}
.nav-brand .wordmark span {
  font-size: 10.5px;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  display: block;
  line-height: 1.4;
  color: rgba(201, 169, 97, 0.75);
  margin-top: 4px;
}

.nav-links {
  display: flex;
  gap: 32px;
  align-items: center;
  font-size: 14px;
  color: rgba(246, 242, 233, 0.78);
  font-weight: 500;
}
.nav-links a { transition: color 0.2s; }
.nav-links a:hover { color: var(--gold-400); }

.nav-cta {
  padding: 10px 18px;
  border: 1px solid rgba(201, 169, 97, 0.4);
  color: var(--gold-300);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: all 0.2s;
}
.nav-cta:hover {
  background: var(--gold-500);
  border-color: var(--gold-500);
  color: var(--navy-900);
}

@media (max-width: 880px) {
  .nav { padding: 14px 20px; }
  .nav-burger { display: flex; }
  .nav-collapse {
    position: fixed;
    top: 0; right: 0;
    width: min(360px, 88vw);
    height: 100vh;
    background: var(--navy-900);
    border-left: 1px solid rgba(201, 169, 97, 0.2);
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 96px 28px 32px;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
    overflow-y: auto;
  }
  .nav-collapse.is-open { transform: translateX(0); }
  .nav-links {
    display: flex !important;
    flex-direction: column;
    gap: 0;
    width: 100%;
  }
  .nav-links a {
    padding: 18px 4px;
    border-bottom: 1px solid rgba(246, 242, 233, 0.08);
    font-size: 17px;
    font-weight: 600;
    color: var(--bone);
    transition: color 0.2s, padding-left 0.2s;
  }
  .nav-links a:hover { color: var(--gold-300); padding-left: 12px; }
  .nav-cta {
    margin-top: 28px;
    text-align: center;
    padding: 16px 22px;
    background: var(--gold-500);
    color: var(--navy-900);
    border-color: var(--gold-500);
  }
  .nav-brand .wordmark span { display: none; }
  .nav-brand .wordmark b { font-size: 13px; }
}
@media (max-width: 760px) {
  .nav-links { display: flex; }
}

/* ===== Hero ===== */

.hero {
  position: relative;
  min-height: 100vh;
  background: var(--navy-900);
  color: var(--bone);
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: 140px 0 100px;
}
@media (max-width: 880px) {
  .hero { padding: 110px 0 70px; min-height: auto; }
}
@media (max-width: 560px) {
  .hero { padding: 100px 0 60px; }
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 80px;
  align-items: center;
}

@media (max-width: 980px) {
  .hero-content { grid-template-columns: 1fr; gap: 48px; }
  .hero-mark { order: -1; }
}
@media (max-width: 560px) {
  .hero-content { gap: 36px; }
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold-400);
  font-weight: 600;
  margin-bottom: 28px;
  flex-wrap: wrap;
  line-height: 1.3;
}
@media (max-width: 480px) {
  .eyebrow { font-size: 10.5px; letter-spacing: 0.24em; margin-bottom: 20px; }
}
.eyebrow::before {
  content: '';
  width: 28px;
  height: 1px;
  background: var(--gold-400);
  flex-shrink: 0;
}

.hero h1 {
  font-family: var(--font-sans);
  font-size: clamp(36px, 6.5vw, 84px);
  line-height: 1;
  letter-spacing: -0.035em;
  font-weight: 800;
  margin-bottom: 28px;
  word-break: break-word;
}
@media (max-width: 480px) {
  .hero h1 { font-size: clamp(32px, 10vw, 44px); line-height: 1.02; }
  .hero h1 br { display: none; }
}
.hero h1 em {
  font-style: normal;
  color: var(--gold-300);
  font-weight: 800;
}

.hero-sub {
  font-size: 18px;
  line-height: 1.6;
  color: rgba(246, 242, 233, 0.75);
  max-width: 560px;
  margin-bottom: 40px;
}
@media (max-width: 560px) {
  .hero-sub { font-size: 16px; }
}

.hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; }
@media (max-width: 480px) {
  .hero-ctas { gap: 12px; }
  .hero-ctas .btn { width: 100%; justify-content: center; }
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 28px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.04em;
  transition: all 0.25s;
}
.btn-primary {
  background: var(--gold-500);
  color: var(--navy-900);
}
.btn-primary:hover { background: var(--gold-300); transform: translateY(-1px); }
.btn-ghost {
  border: 1px solid rgba(246, 242, 233, 0.25);
  color: var(--bone);
}
.btn-ghost:hover { border-color: var(--gold-400); color: var(--gold-300); }

.btn .arrow { transition: transform 0.25s; }
.btn:hover .arrow { transform: translateX(4px); }

.hero-mark {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}
.hero-mark-frame {
  position: relative;
  padding: 44px 38px;
  border: 1px solid rgba(201, 169, 97, 0.3);
  background: rgba(10, 24, 56, 0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  max-width: 100%;
  width: 100%;
  max-width: 480px;
  overflow: hidden;
  box-sizing: border-box;
}
.hero-mark-frame svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
}
@media (max-width: 880px) {
  .hero-mark-frame { padding: 28px 22px; max-width: 420px; }
}
@media (max-width: 480px) {
  .hero-mark-frame { padding: 22px 16px; max-width: 100%; }
}
.hero-mark-frame::before, .hero-mark-frame::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-color: var(--gold-500);
  border-style: solid;
  border-width: 0;
}
.hero-mark-frame::before {
  top: -1px; left: -1px;
  border-top-width: 2px; border-left-width: 2px;
}
.hero-mark-frame::after {
  bottom: -1px; right: -1px;
  border-bottom-width: 2px; border-right-width: 2px;
}

/* Stats strip */
.hero-stats {
  position: relative;
  z-index: 2;
  margin-top: 80px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  padding-top: 32px;
  border-top: 1px solid rgba(246, 242, 233, 0.12);
}
@media (max-width: 880px) {
  .hero-stats { margin-top: 50px; gap: 24px; }
  .hero-stats .stat-num { font-size: 42px; }
}
.hero-stats .stat-num {
  font-family: var(--font-sans);
  font-size: 52px;
  font-weight: 800;
  color: var(--gold-300);
  line-height: 1;
  margin-bottom: 10px;
  letter-spacing: -0.03em;
}
.hero-stats .stat-num sup { font-size: 22px; vertical-align: top; margin-left: 2px; color: var(--gold-500); font-weight: 700; }
.hero-stats .stat-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(246, 242, 233, 0.55);
  font-weight: 500;
}

@media (max-width: 760px) {
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
}

/* Hero tech bar */
.hero-tech-bar {
  margin-top: 36px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 14px;
  padding: 14px 0;
  border-top: 1px dashed rgba(201, 169, 97, 0.22);
  border-bottom: 1px dashed rgba(201, 169, 97, 0.22);
}
@media (max-width: 560px) {
  .hero-tech-bar { gap: 8px 10px; padding: 12px 0; }
  .tech-tag { font-size: 10.5px; padding: 4px 8px; }
}
.tech-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(201, 169, 97, 0.75);
  font-weight: 600;
  margin-right: 4px;
}
.tech-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  padding: 5px 10px;
  border: 1px solid rgba(201, 169, 97, 0.3);
  color: rgba(246, 242, 233, 0.85);
  font-weight: 500;
}

/* ===== Section base ===== */

section.block {
  padding: 120px 0;
  position: relative;
}
@media (max-width: 880px) { section.block { padding: 80px 0; } }
@media (max-width: 560px) { section.block { padding: 64px 0; } }

.section-head {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 60px;
  margin-bottom: 80px;
  align-items: end;
}
@media (max-width: 880px) {
  .section-head { margin-bottom: 50px; }
}
@media (max-width: 860px) {
  .section-head { grid-template-columns: 1fr; gap: 24px; }
}

.section-head .label {
  font-size: 12px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold-500);
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-head .label::before {
  content: '';
  width: 32px;
  height: 1px;
  background: var(--gold-500);
}
.section-head h2 {
  font-family: var(--font-sans);
  font-size: clamp(34px, 4.6vw, 56px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  font-weight: 800;
}
.section-head h2 em {
  font-style: normal;
  color: var(--gold-500);
  font-weight: 800;
}
.section-head .lede {
  font-size: 17px;
  line-height: 1.65;
  color: var(--muted);
  max-width: 540px;
}

/* ===== Tagline band ===== */

.tagline-band {
  background: var(--navy-900);
  color: var(--bone);
  padding: 50px 0;
  border-top: 1px solid rgba(201, 169, 97, 0.2);
  border-bottom: 1px solid rgba(201, 169, 97, 0.2);
  overflow: hidden;
  position: relative;
}
.tagline-band::before,
.tagline-band::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-500) 50%, transparent);
  opacity: 0.4;
}
.tagline-band::before { top: 0; }
.tagline-band::after  { bottom: 0; }
.tagline-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(20px, 4vw, 60px);
  flex-wrap: wrap;
}
.tagline-word {
  font-family: var(--font-sans);
  font-weight: 800;
  font-size: clamp(28px, 5vw, 56px);
  line-height: 1;
  letter-spacing: -0.035em;
  color: var(--gold-300);
  text-transform: lowercase;
}
.tagline-word:nth-child(3) {
  color: var(--bone);
}
.tagline-word:nth-child(5) {
  color: var(--gold-500);
}
.tagline-dot {
  width: 10px; height: 10px;
  background: var(--gold-500);
  flex-shrink: 0;
}

/* ===== Services ===== */

.services-block { background: var(--bone); }

.services-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
@media (max-width: 1100px) { .services-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .services-grid { grid-template-columns: 1fr; } }

.service-card {
  background: #fff;
  border: 1px solid rgba(13, 18, 38, 0.08);
  border-radius: 4px;
  padding: 28px 24px 24px;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  overflow: hidden;
}
.service-card.is-highlight {
  background: linear-gradient(180deg, #fff, #fbf6ea);
  border-color: rgba(201, 169, 97, 0.5);
}
.service-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: var(--gold-500);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.3s;
}
.service-card:hover { transform: translateY(-3px); border-color: rgba(201, 169, 97, 0.5); box-shadow: 0 18px 40px -20px rgba(10,24,56,0.18); }
.service-card:hover::before { transform: scaleX(1); }
.service-card.is-highlight::before { transform: scaleX(1); background: var(--gold-500); }

.sc-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(13,18,38,0.08);
}
.sc-num {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.18em;
  color: var(--gold-500); font-weight: 600;
}
.sc-cat {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.28em;
  color: var(--muted); font-weight: 600;
  text-transform: uppercase;
}
.service-card h3 {
  font-family: var(--font-sans);
  font-size: 19px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--navy-900);
}
.service-card p {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--muted);
  flex: 1;
}
.sc-list {
  list-style: none;
  display: flex; flex-direction: column; gap: 6px;
  margin-top: 4px;
}
.sc-list li {
  font-size: 12px;
  color: var(--navy-700);
  display: flex; align-items: center; gap: 8px;
  font-weight: 500;
}
.sc-list .dot {
  width: 6px; height: 6px;
  background: var(--gold-500);
  display: inline-block;
}
.service-card .more {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--navy-900);
  display: flex; align-items: center; gap: 8px;
  margin-top: 8px;
  padding-top: 14px;
  border-top: 1px solid rgba(13,18,38,0.06);
  transition: gap 0.2s, color 0.2s;
}
.service-card:hover .more { gap: 12px; color: var(--gold-500); }

/* ===== Process ===== */

.process-block {
  background: var(--navy-900);
  color: var(--bone);
  overflow: hidden;
  position: relative;
}
.process-block .section-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: 0.35;
  pointer-events: none;
}
.process-block .container { position: relative; z-index: 1; }
.process-block .section-head .label { color: var(--gold-400); }
.process-block .section-head .label::before { background: var(--gold-400); }
.process-block .section-head h2 em { color: var(--gold-300); }
.process-block .section-head .lede { color: rgba(246, 242, 233, 0.7); }

.process-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
@media (max-width: 880px) { .process-grid { grid-template-columns: 1fr; } }

.process-card {
  border: 1px solid rgba(201, 169, 97, 0.22);
  background: rgba(10, 24, 56, 0.4);
  padding: 30px;
  border-radius: 4px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.process-card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 60%; height: 2px;
  background: var(--gold-500);
}
.pc-num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--gold-500);
  font-weight: 600;
}
.pc-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  color: rgba(246, 242, 233, 0.5);
  text-transform: uppercase;
  position: absolute;
  top: 30px;
  right: 30px;
}
.process-card h4 {
  font-family: var(--font-sans);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.1;
  margin-top: 8px;
}
.process-card p {
  font-size: 14.5px;
  line-height: 1.6;
  color: rgba(246, 242, 233, 0.7);
}
.pc-out {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid rgba(246, 242, 233, 0.1);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pc-out .k {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  color: rgba(201, 169, 97, 0.7);
  text-transform: uppercase;
}
.pc-out .v {
  font-size: 14px;
  color: var(--gold-300);
  font-weight: 600;
}

/* ===== Industries / clientes ===== */

.clients-block { background: var(--bone-2); padding: 70px 0; }
.clients-head { margin-bottom: 32px; }
.label-mono {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.industries-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
}
@media (max-width: 880px) { .industries-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .industries-grid { grid-template-columns: repeat(2, 1fr); } }
.ind {
  border: 1px solid rgba(13, 18, 38, 0.1);
  background: #fff;
  padding: 20px 16px;
  display: flex; flex-direction: column; gap: 8px;
  align-items: flex-start;
  border-radius: 3px;
  position: relative;
}
.ind::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 24px; height: 1px;
  background: var(--gold-500);
}
.ind-code {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--gold-500);
  font-weight: 700;
}
.ind-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--navy-900);
  letter-spacing: -0.01em;
}

/* ===== Quote / about ===== */

.about-block { background: var(--bone); }
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
@media (max-width: 880px) {
  .about-grid { grid-template-columns: 1fr; gap: 50px; }
}
.about-visual {
  aspect-ratio: 4/5;
  background: var(--navy-900);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(13, 18, 38, 0.1);
}
.about-frame-mark {
  position: absolute;
  top: 18px; left: 18px; z-index: 2;
  opacity: 0.75;
}
.about-frame-corner {
  position: absolute; z-index: 2;
  width: 18px; height: 18px;
  border: 2px solid var(--gold-500);
  border-style: solid;
}
.about-frame-corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
.about-frame-corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
.about-frame-corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
.about-frame-corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

.about-visual .placeholder {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(45deg, rgba(201,169,97,0.04) 0, rgba(201,169,97,0.04) 2px, transparent 2px, transparent 14px),
    var(--navy-800);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(201, 169, 97, 0.55);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-align: center;
  padding: 30px;
}
.about-text h2.about-name,
.about-text h2 {
  font-family: var(--font-sans);
  font-size: clamp(40px, 5vw, 60px);
  line-height: 1;
  letter-spacing: -0.035em;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--navy-900);
}
.about-role {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-500);
  font-weight: 600;
  margin-bottom: 28px;
}
.about-text p {
  font-size: 16px;
  line-height: 1.7;
  color: var(--muted);
  margin-bottom: 16px;
}
.about-text p strong {
  color: var(--navy-900);
  font-weight: 700;
}
.about-meta {

/* ===== WhatsApp floating button ===== */

.wa-float {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 200;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #25d366;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 28px rgba(37, 211, 102, 0.35), 0 4px 12px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  animation: wa-pulse 2.4s ease-out infinite;
}
.wa-float::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: #25d366;
  z-index: -1;
  opacity: 0.55;
  animation: wa-ring 2.4s ease-out infinite;
}
.wa-float:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 18px 36px rgba(37, 211, 102, 0.45), 0 6px 14px rgba(0, 0, 0, 0.22);
}
.wa-float:hover .wa-tooltip { opacity: 1; transform: translateX(0); }
.wa-tooltip {
  position: absolute;
  right: 72px;
  top: 50%;
  transform: translateY(-50%) translateX(8px);
  background: var(--navy-900);
  color: var(--bone);
  padding: 8px 14px;
  border-radius: 4px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  border: 1px solid rgba(201, 169, 97, 0.3);
}
.wa-tooltip::after {
  content: '';
  position: absolute;
  right: -5px;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
  width: 8px;
  height: 8px;
  background: var(--navy-900);
  border-right: 1px solid rgba(201, 169, 97, 0.3);
  border-top: 1px solid rgba(201, 169, 97, 0.3);
}

@keyframes wa-pulse {
  0%, 100% { box-shadow: 0 12px 28px rgba(37, 211, 102, 0.35), 0 4px 12px rgba(0, 0, 0, 0.18), 0 0 0 0 rgba(37, 211, 102, 0); }
  50% { box-shadow: 0 12px 28px rgba(37, 211, 102, 0.35), 0 4px 12px rgba(0, 0, 0, 0.18), 0 0 0 8px rgba(37, 211, 102, 0); }
}
@keyframes wa-ring {
  0% { transform: scale(1); opacity: 0.55; }
  100% { transform: scale(1.6); opacity: 0; }
}

@media (max-width: 640px) {
  .wa-float { bottom: 20px; right: 20px; width: 54px; height: 54px; }
  .wa-tooltip { display: none; }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
